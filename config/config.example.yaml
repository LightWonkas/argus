  maximum_age_minutes: 1440
  future_tolerance_seconds: 120
  default_ttl_minutes: 360
  minimum_reliability: 0.60
  verified_reliability: 0.80
  parser_quarantine_error_rate: 0.50
  minimum_critical_sources_healthy: 1
  raw_document_retention_hours: 168
  tradingview_enabled: false
  tradingview_ttl_seconds: 120
  tradingview_rate_limit_per_minute: 30
intraday_planner:
  minimum_confidence: 65.0
  minimum_news_reliability: 0.70
  maximum_manipulation_risk: 35.0
  maximum_holding_minutes: 120
  plan_validity_seconds: 300
  reevaluation_cooldown_seconds: 300
  meaningful_edge_change_bps: 20.0
universe_discovery:
  # Public Binance Spot-USDT discovery only. This flag does not enable execution/arming.
  enabled: true
  quote_asset: USDT
  broad_scan_interval_s: 900
  deep_watchlist_size: 10
  deep_candidate_pool_multiplier: 3
  liquidity_probe_notional: 1000.0
  watchlist_rotation_cooldown_s: 1800
  minimum_listing_age_days: 30
  reject_unknown_listing_age: true
  minimum_history_bars: 100
  minimum_quote_volume_24h: 50000000.0
  maximum_spread_bps: 15.0
  minimum_depth_quote: 100000.0
  maximum_slippage_bps: 20.0
  maximum_realized_volatility_pct: 250.0
  blacklist: []
fees:
  conservative_maker_bps: 12.0
  conservative_taker_bps: 15.0
  minimum_net_edge_bps: 35.0
  model_uncertainty_buffer_bps: 20.0
  additional_execution_buffer_bps: 5.0
  schedule_max_age_s: 3600
  # PUBLIC_MONITOR/SHADOW research artifact only; never sufficient for LIVE_SPOT.
  allow_conservative_config_fallback: true
  assume_bnb_discount: false
portfolio_policy:
  cash_reserve_pct: 25.0
  risk_per_trade_pct: 0.25
  maximum_symbol_weight_pct: 20.0
  maximum_positions: 3
  liquidity_participation_pct: 1.0
  maximum_btc_correlation: 0.85
  maximum_daily_trades: 6
  same_symbol_cooldown_s: 900
retention:
  # Bounds public-stream growth. Raw rows are never deleted without a successful rollup.
  # No automatic VACUUM.
  enabled: true
  maintenance_interval_s: 30
  market_data_days: 365
  event_days: 90
  decision_days: 730
  raw_trade_hours: 6
  raw_depth_hours: 1
  raw_book_snapshot_hours: 1
  raw_ticker_hours: 6
  raw_news_document_hours: 168
  rollup_bucket_s: 60
  maintenance_batch_size: 10000
  maximum_database_mb: 2048
  minimum_free_disk_mb: 5120
  maximum_backlog_events: 1000000
diagnostics:
  # Tracemalloc/heap counting is enabled only when the soak CLI explicitly asks for it.
  enabled: false
  metrics_mode: production
  tracemalloc_frames: 10
  maximum_metric_samples: 4096
  maximum_stream_labels: 2048
  memory_warmup_seconds: 3600
  memory_minimum_samples: 12
  memory_minimum_span_seconds: 7200
  python_heap_slope_mib_per_hour: 2.0
  private_bytes_slope_mib_per_hour: 5.0
  private_bytes_budget_mib: 512.0
  memory_acceptance_window_seconds: 7200
  task_growth_per_hour: 1.0
  thread_growth_per_hour: 1.0
  handle_growth_per_hour: 2.0
  socket_growth_per_hour: 2.0
  queue_final_depth: 0
  reconnect_burst_window_seconds: 60
  reconnect_burst_max: 3
  reconnect_per_worker_per_hour: 2.0
  minimum_median_connection_lifetime_s: 900.0
  api_minimum_success_rate: 0.999
  event_loop_lag_p95_ms: 1000.0
  event_latency_p95_ms: 5000.0
outcome:
  k_atr: 1.0
  atr_period: 14
  horizon_bars: 5
  min_n_warn: 30
macro:
