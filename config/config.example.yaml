version: 1
universe:
  symbols:
  - BTCUSDT
  - ETHUSDT
  # BTC/ETH are only a safe bootstrap fallback; the live universe comes from PIT discovery.
  strict: false
exchanges:
- name: binance
  enabled: true
  public_data_only: true
  rest_enabled: true
  websocket_enabled: true
market_types:
- spot
- perpetual
timeframes:
- 1m
- 5m
- 15m
- 30m
- 1h
- 4h
ingestion:
  backfill_limit: 500
  reconcile_interval_s: 300
  reconnect_base_s: 1.0
  reconnect_max_s: 60.0
  reconnect_jitter_ratio: 0.2
  disconnect_after_s: 30.0
  websocket:
    compression:
      enabled: true
    max_message_size: 1048576
    max_queue_messages: 16
    # Ping/pong is handled solely by the websockets library.
    ping_interval_s: 20.0
    ping_timeout_s: 20.0
    open_timeout_s: 10.0
    close_timeout_s: 10.0
    # Application-level no-message guard; it does not replace the ping mechanism.
    read_timeout_s: 30.0
    # Backoff resets only after a stable connection, not after a single message.
    stable_connection_reset_s: 900.0
  rate_limit_per_s: 10.0
  order_book_depth: 100
  # All events are processed in memory; the persisted research view is the 1m rollup.
  # Raw trade/depth JSON is off because it grows unsustainably over a 7-day run.
  persist_raw_trades: false
  persist_raw_depth_deltas: false
  order_book_materialize_interval_s: 10.0
  stream_commit_batch_size: 250
watchlist:
- symbol: BTCUSDT
  asset_class: crypto
  tier: watchlist
  note: Bitcoin
  timeframes: [1m, 5m, 15m, 30m, 1h, 4h]
- symbol: ETHUSDT
  asset_class: crypto
  tier: watchlist
  note: Ether
  timeframes: [1m, 5m, 15m, 30m, 1h, 4h]
# Manually entered holdings (optional). Illustrative example entry:
# holdings:
# - symbol: BTCUSDT
#   asset_class: crypto
#   quantity: 1.0
#   avg_cost: 10000.0
#   cost_currency: USD
holdings: []
triggers:
  rsi_period: 14
  rsi_overbought: 70.0
  rsi_oversold: 30.0
  price_move_pct: 5.0
  atr_period: 14
  atr_spike_mult: 2.0
  ema_fast: 12
  ema_slow: 26
quality:
  stale_factor: 3.0
  max_jump_pct: 25.0
  gap_factor: 1.5
  min_bars: 30
  max_clock_skew_s: 30.0
  crypto_max_age_s: 30.0
  # 5m bucket start + completion/publication tolerance of the next bucket.
  long_short_ratio_max_age_s: 660.0
  crypto_max_spread_bps: 20.0
  max_spot_perpetual_deviation_bps: 100.0
  crypto_missing_required_action: reject
  crypto_book_action: quarantine
  crypto_divergence_action: quarantine
  empty_action: reject
  stale_action: quarantine
  duplicate_action: accept_with_warning
  gap_action: quarantine
  disorder_action: accept_with_warning
  outlier_action: quarantine
  future_action: quarantine
  insufficient_history_action: quarantine
features:
  ema_fast: 12
  ema_slow: 26
  rsi_period: 14
  atr_period: 14
  realized_vol_window: 24
  volume_zscore_window: 30
  order_book_depths: [5, 10, 25]
regime:
  high_volatility_natr_pct: 4.0
  low_liquidity_spread_bps: 20.0
  squeeze_funding_abs: 0.001
  min_confidence_pct: 55
loop:
  timeframe: 1d
  limit: 100
  min_severity: medium
  cooldown_s: 900.0
  fetch_retries: 2
  circuit_threshold: 5
  circuit_reset_s: 300.0
  holdings_interval_s: 300
  watchlist_interval_s: 900
  broad_interval_s: 3600
alerts:
  min_instant_severity: high
  quiet_start: '23:00'
  quiet_end: 08:00
  quiet_tz: Europe/Istanbul
  critical_overrides_quiet: true
  briefing_interval_s: 86400
llm_roles:
  routine_web_search: false
  deep_web_search: false
  onchain_enabled: false
risk:
  spot_only: true
  leverage: 0
  live_orders_enabled: false
  human_approval_required: true
  default_decision: no_trade
  max_portfolio_risk_pct: 0.5
  daily_loss_limit_pct: 2.0
  weekly_loss_limit_pct: 5.0
  max_drawdown_pct: 10.0
  max_concurrent_positions: 1
  max_btc_eth_correlation: 0.9
  max_correlated_exposure_pct: 25.0
  min_quote_volume_24h: 50000000.0
  max_spread_bps: 15.0
  max_slippage_bps: 20.0
  max_data_age_s: 30.0
  max_normalized_atr_pct: 8.0
  cooldown_s: 900.0
  kill_switch: false
shadow:
  enabled: false
  commission_bps: 10.0
  slippage_bps: 5.0
  partial_fill_ratio: 1.0
  timeout_s: 3600
backtest:
  train_ratio: 0.6
  validation_ratio: 0.2
  test_ratio: 0.2
  walk_forward: true
  include_commission: true
  include_spread: true
  include_slippage: true
  include_funding: true
cost:
  monthly_llm_limit_usd: 100.0
trading:
  mode: public_monitor
  live_execution_enabled: false
  submission_authorized: false
  leverage: 0
  require_explicit_arming: true
  margin_enabled: false
  futures_execution_enabled: false
  withdrawals_enabled: false
  transfers_enabled: false
  execution_backend: disabled
  quote_asset: USDT
  maximum_mission_days: 7
  default_end_policy: manage_to_exit
mission_policy:
  display_currency: TRY
  timezone: Europe/Istanbul
  # The target is not a promise: it only locks realized net PnL after all costs.
  daily_profit_stop_pct: 10.0
  daily_loss_stop_pct: 2.0
  maximum_drawdown_pct: 10.0
  maximum_conversion_age_s: 600
