[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "Argus — always-on market & news monitoring with LLM-assisted decision support (research/educational; not financial advice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LightWonkas" }]
keywords = ["market-data", "news-analysis", "llm", "decision-support", "fastapi"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]

# Minimal runtime dependencies needed for the core package to run.
# Heavy dependencies (OpenBB, ccxt, fastapi, anthropic, redis ...) live in the
# optional groups below and are installed only when needed.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo has no system database on Windows
]

[project.optional-dependencies]
# Development / quality gate
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
    "httpx>=0.27",  # FastAPI TestClient
    "fakeredis>=2.20",  # Redis Streams round-trip test (no network)
]
# ingestion: ccxt (crypto) + websockets (public streams).
ingestion = ["ccxt>=4.2", "websockets>=14"]
# bist: borsapy, an unofficial third-party library for Turkish market data (BIST/KAP/EVDS).
# Optional on purpose; check the upstream sources' terms of use before enabling it.
bist = ["borsapy>=0.11.0"]
# OpenBB (global data/news) is a separate extra — very heavy; install only when needed.
openbb = ["openbb>=4"]
# platform: redis (event bus).
platform = ["redis>=5"]
# brain: anthropic (LLM client).
brain = ["anthropic>=0.40"]
# interface: python-telegram-bot (command bot) + APScheduler (watch daemon).
interface = ["python-telegram-bot>=21", "apscheduler>=3.10"]
# dashboard: FastAPI backend of the web cockpit. The frontend is separate (web/).
# Password hashing uses the stdlib (hashlib.scrypt) — no extra dependency.
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Repository = "https://github.com/LightWonkas/argus"
Issues = "https://github.com/LightWonkas/argus/issues"

[project.scripts]
argus = "argus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

# ── Ruff (lint + format) ─────────────────────────────────────────────────────
[tool.ruff]
src = ["src", "tests", "scripts"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous-unicode warnings


# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
packages = ["argus"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true

# Third-party modules without type stubs (imported lazily)
[[tool.mypy.overrides]]
module = [
    "ccxt",
    "borsapy",
    "openbb",
    "anthropic",
    "telegram",
    "telegram.ext",
    "redis",
    "apscheduler.schedulers.blocking",
    "apscheduler.triggers.interval",
    "websockets",
]
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=argus --cov-report=term-missing"

[tool.coverage.run]
source = ["argus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
