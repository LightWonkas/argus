name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, tokens or `.env` contents.
        Security problems go through private vulnerability reporting (see SECURITY.md), not public issues.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. docker compose up --build
        2. open http://localhost:3000
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, Node version, Docker or local, LLM provider"
    validations:
      required: true
